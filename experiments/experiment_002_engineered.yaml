experiment_id: "EXP_002_ENGINEERED"
description: "ML models trained on the 97-feature dataset containing engineered clinical features"
dataset: "train_features.parquet"
features_count: 95 # Excluding PatientID and SepsisLabel
window_size_hours: 6
prediction_horizon_hours: 6
git_version: "v0.4"
models:
  - logistic_regression
  - random_forest
  - xgboost
hyperparameters:
  logistic_regression:
    penalty: "l2"
    C: 1.0
    solver: "saga"
    class_weight: "balanced"
  random_forest:
    n_estimators: 100
    max_depth: 8
    class_weight: "balanced"
    random_state: 42
  xgboost:
    n_estimators: 100
    max_depth: 6
    scale_pos_weight: 54.5 # Sepsis class imbalance ratio
    learning_rate: 0.1
    random_state: 42
