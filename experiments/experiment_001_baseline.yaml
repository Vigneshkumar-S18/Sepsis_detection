experiment_id: "EXP_001_BASELINE"
description: "Baseline ML models trained on the 68-feature preprocessed dataset"
dataset: "train_processed.parquet"
features_count: 66 # Excluding PatientID and SepsisLabel
window_size_hours: 6
prediction_horizon_hours: 6
git_version: "v0.3"
models:
  - logistic_regression
  - random_forest
  - xgboost
hyperparameters:
  logistic_regression:
    penalty: "l2"
    C: 1.0
    solver: "saga"
    class_weight: "balanced"
  random_forest:
    n_estimators: 100
    max_depth: 8
    class_weight: "balanced"
    random_state: 42
  xgboost:
    n_estimators: 100
    max_depth: 6
    scale_pos_weight: 54.5 # Sepsis class imbalance ratio
    learning_rate: 0.1
    random_state: 42
